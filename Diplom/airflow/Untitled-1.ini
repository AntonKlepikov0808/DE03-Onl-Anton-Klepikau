# dags/pharmacy_etl_dag.py
from datetime import datetime, timedelta
from airflow import DAG
from airflow.operators.python import PythonOperator
from airflow.operators.sql import SQLExecuteQueryOperator
from airflow.providers.apache.kafka.sensors.kafka import KafkaSensor
import json
from kafka import KafkaConsumer
import psycopg2
import logging

default_args = {
    'owner': 'klepikov',
    'depends_on_past': False,
    'start_date': datetime(2026, 2, 1),
    'email_on_failure': False,
    'email_on_retry': False,
    'retries': 1,
    'retry_delay': timedelta(minutes=5)
}

def extract_from_kafka(**context):
    """Чтение данных из Kafka"""
    consumer = KafkaConsumer(
        'pharmacy_prices',
        bootstrap_servers='kafka:9092',
        auto_offset_reset='earliest',
        enable_auto_commit=True,
        value_deserializer=lambda m: json.loads(m.decode('utf-8')),
        max_poll_records=100
    )
    
    messages = []
    for msg in consumer:
        messages.append(msg.value)
        if len(messages) >= 100:
            break
    
    consumer.close()
    context['ti'].xcom_push(key='raw_messages', value=messages)
    logging.info(f"Извлечено {len(messages)} сообщений из Kafka")

def load_raw_to_postgres(**context):
    """Загрузка сырых данных в таблицу raw_data"""
    messages = context['ti'].xcom_pull(key='raw_messages')
    
    conn = psycopg2.connect(
        host='postgres',
        database='pharmacy_prices',
        user='postgres',
        password='postgres'
    )
    cur = conn.cursor()
    
    for msg in messages:
        cur.execute(
            "INSERT INTO raw_data (data, source, received_at) VALUES (%s, %s, NOW())",
            (json.dumps(msg), 'kafka')
        )
    
    conn.commit()
    cur.close()
    conn.close()
    logging.info(f"Загружено {len(messages)} записей в raw_data")

def transform_and_load_core(**context):
    """Трансформация и загрузка в измерения и факты"""
    conn = psycopg2.connect(
        host='postgres',
        database='pharmacy_prices',
        user='postgres',
        password='postgres'
    )
    cur = conn.cursor()
    
    # Получаем необработанные записи
    cur.execute("SELECT id, data FROM raw_data WHERE processed = FALSE LIMIT 500")
    rows = cur.fetchall()
    
    for row_id, raw_json in rows:
        try:
            data = raw_json if isinstance(raw_json, dict) else json.loads(raw_json)
            
            # Очистка данных
            pharmacy_name = data.get('pharmacy_name', '').lower().strip()
            city = data.get('pharmacy_city', 'unknown').lower().strip()
            product_name = data.get('product_name', '').lower().strip()
            category = data.get('category', 'other').lower().strip()
            manufacturer = data.get('manufacturer', 'unknown').lower().strip()
            
            # Заполнение значений по умолчанию
            quantity = data.get('quantity', 0)
            if quantity is None:
                quantity = 0
                
            discount = data.get('discount_percent', 0)
            if discount is None:
                discount = 0
            
            # Вставка аптеки
            cur.execute("""
                INSERT INTO pharmacies (pharmacy_id, name, city)
                VALUES (%s, %s, %s)
                ON CONFLICT (pharmacy_id) DO UPDATE
                SET name = EXCLUDED.name, city = EXCLUDED.city
            """, (data['pharmacy_id'], pharmacy_name, city))
            
            # Вставка товара
            cur.execute("""
                INSERT INTO products (product_id, name, category, manufacturer)
                VALUES (%s, %s, %s, %s)
                ON CONFLICT (product_id) DO UPDATE
                SET name = EXCLUDED.name, 
                    category = EXCLUDED.category,
                    manufacturer = EXCLUDED.manufacturer
            """, (data['product_id'], product_name, category, manufacturer))
            
            # Вставка цены
            cur.execute("""
                INSERT INTO prices (pharmacy_id, product_id, price, old_price,
                                   quantity, discount_percent, updated_at)
                VALUES (%s, %s, %s, %s, %s, %s, NOW())
            """, (
                data['pharmacy_id'], 
                data['product_id'],
                data['price'],
                data.get('old_price'),
                quantity,
                discount
            ))
            
            # Помечаем как обработанное
            cur.execute("UPDATE raw_data SET processed = TRUE WHERE id = %s", (row_id,))
            conn.commit()
            
        except Exception as e:
            cur.execute("UPDATE raw_data SET error_message = %s WHERE id = %s", (str(e), row_id))
            conn.commit()
            logging.error(f"Ошибка при обработке записи {row_id}: {e}")
    
    cur.close()
    conn.close()
    logging.info(f"Обработано {len(rows)} записей")

def refresh_marts(**context):
    """Обновление аналитических витрин"""
    conn = psycopg2.connect(
        host='postgres',
        database='pharmacy_prices',
        user='postgres',
        password='postgres'
    )
    cur = conn.cursor()
    
    # Витрина current_prices
    cur.execute("TRUNCATE TABLE current_prices;")
    cur.execute("""
        INSERT INTO current_prices
        SELECT 
            ph.pharmacy_id, ph.name as pharmacy_name, ph.city,
            p.product_id, p.name as product_name, p.category, p.manufacturer,
            pr.price, pr.old_price, pr.quantity, pr.discount_percent,
            pr.updated_at
        FROM prices pr
        JOIN pharmacies ph ON pr.pharmacy_id = ph.pharmacy_id
        JOIN products p ON pr.product_id = p.product_id
        WHERE pr.updated_at >= NOW() - interval '7 days';
    """)
    
    # Витрина product_price_stats
    cur.execute("TRUNCATE TABLE product_price_stats;")
    cur.execute("""
        INSERT INTO product_price_stats
        SELECT 
            p.product_id, p.name as product_name, p.category,
            COUNT(DISTINCT pr.pharmacy_id) as pharmacy_count,
            MIN(pr.price) as min_price,
            MAX(pr.price) as max_price,
            AVG(pr.price)::numeric(10,2) as avg_price,
            SUM(pr.quantity) as total_stock
        FROM prices pr
        JOIN products p ON pr.product_id = p.product_id
        WHERE pr.updated_at >= NOW() - interval '30 days'
        GROUP BY p.product_id, p.name, p.category;
    """)
    
    # Витрина pharmacy_stats
    cur.execute("TRUNCATE TABLE pharmacy_stats;")
    cur.execute("""
        INSERT INTO pharmacy_stats
        SELECT 
            ph.pharmacy_id, ph.name as pharmacy_name, ph.city,
            COUNT(DISTINCT pr.product_id) as product_count,
            AVG(pr.price)::numeric(10,2) as avg_price,
            SUM(pr.quantity) as total_stock
        FROM prices pr
        JOIN pharmacies ph ON pr.pharmacy_id = ph.pharmacy_id
        WHERE pr.updated_at >= NOW() - interval '30 days'
        GROUP BY ph.pharmacy_id, ph.name, ph.city;
    """)
    
    conn.commit()
    cur.close()
    conn.close()
    logging.info("Витрины данных обновлены")

# Создание DAG
with DAG(
    'pharmacy_prices_etl',
    default_args=default_args,
    description='ETL пайплайн для прайс-листов аптек',
    schedule='*/15 * * * *',  # Каждые 15 минут
    catchup=False,
    tags=['pharmacy', 'etl']
) as dag:
    
    # Сенсор ожидания сообщений в Kafka
    wait_for_kafka = KafkaSensor(
        task_id='wait_for_kafka',
        kafka_config={'bootstrap.servers': 'kafka:9092'},
        topic='pharmacy_prices',
        timeout=60 * 5,  # 5 минут
        poke_interval=30  # Проверка каждые 30 секунд
    )
    
    # Извлечение из Kafka
    extract_task = PythonOperator(
        task_id='extract_from_kafka',
        python_callable=extract_from_kafka,
        provide_context=True
    )
    
    # Загрузка в сырую таблицу
    load_raw_task = PythonOperator(
        task_id='load_raw_to_postgres',
        python_callable=load_raw_to_postgres,
        provide_context=True
    )
    
    # Трансформация и загрузка в ядро
    transform_task = PythonOperator(
        task_id='transform_and_load_core',
        python_callable=transform_and_load_core
    )
    
    # Обновление витрин
    marts_task = PythonOperator(
        task_id='refresh_marts',
        python_callable=refresh_marts
    )
    
    # Порядок выполнения
    wait_for_kafka >> extract_task >> load_raw_task >> transform_task >> marts_task