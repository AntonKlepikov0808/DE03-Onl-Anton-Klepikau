# transform_and_load.py
import json
import psycopg2
from pydantic import BaseModel, validator
import logging

logging.basicConfig(level=logging.INFO)

# Pydantic модель для валидации
class PriceMessage(BaseModel):
    pharmacy_id: str
    pharmacy_name: str
    pharmacy_city: str
    product_id: str
    product_name: str
    category: str
    manufacturer: str
    price: float
    old_price: float = None
    quantity: int = 0
    discount_percent: int = 0

    @validator('pharmacy_name', 'pharmacy_city', 'product_name', 'category', 'manufacturer')
    def lower_case(cls, v):
        return v.lower().strip() if v else v

    @validator('price')
    def positive_price(cls, v):
        if v <= 0:
            raise ValueError('price must be > 0')
        return v

# Подключение
conn = psycopg2.connect(
    host='localhost',
    database='pharmacy_prices',
    user='postgres',
    password='postgres'
)
cur = conn.cursor()

# Получаем необработанные записи
cur.execute("SELECT id, data FROM raw_data WHERE processed = FALSE")
rows = cur.fetchall()

for row in rows:
    raw_id, raw_json = row
    try:
        msg = PriceMessage(**raw_json)

        # Обновление/вставка аптеки
        cur.execute("""
            INSERT INTO pharmacies (pharmacy_id, name, city)
            VALUES (%s, %s, %s)
            ON CONFLICT (pharmacy_id) DO UPDATE
            SET name = EXCLUDED.name, city = EXCLUDED.city
        """, (msg.pharmacy_id, msg.pharmacy_name, msg.pharmacy_city))

        # Обновление/вставка товара
        cur.execute("""
            INSERT INTO products (product_id, name, category, manufacturer)
            VALUES (%s, %s, %s, %s)
            ON CONFLICT (product_id) DO UPDATE
            SET name = EXCLUDED.name, category = EXCLUDED.category,
                manufacturer = EXCLUDED.manufacturer
        """, (msg.product_id, msg.product_name, msg.category, msg.manufacturer))

        # Вставка факта цены
        cur.execute("""
            INSERT INTO prices (pharmacy_id, product_id, price, old_price,
                                quantity, discount_percent, updated_at)
            VALUES (%s, %s, %s, %s, %s, %s, NOW())
        """, (msg.pharmacy_id, msg.product_id, msg.price, msg.old_price,
              msg.quantity, msg.discount_percent))

        # Помечаем запись как обработанную
        cur.execute("UPDATE raw_data SET processed = TRUE WHERE id = %s", (raw_id,))
        conn.commit()
        logging.info(f"Processed raw_id {raw_id}")

    except Exception as e:
        cur.execute("UPDATE raw_data SET error_message = %s WHERE id = %s", (str(e), raw_id))
        conn.commit()
        logging.error(f"Error processing {raw_id}: {e}")

cur.close()
conn.close()